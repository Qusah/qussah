allowBuilds:
  '@parcel/watcher': true
  bufferutil: true
  es5-ext: true
  utf-8-validate: true
# Exempt first-party Salla platform packages from the minimum-release-age
# supply-chain delay. These are required, trusted, frequently-published Salla
# packages; the age guard still applies to all other (third-party) dependencies.
# (Name patterns, not name@version — pnpm matches this list by package name.)
minimumReleaseAgeExclude:
  - '@salla.sa/*'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - bufferutil
  - es5-ext
  - utf-8-validate
